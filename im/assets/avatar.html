<div class="tile" id="tile" data-state="idle" dir="rtl">
  <img id="still" alt="" />
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="hud">
    <span class="clock"><i></i><b id="clock"></b></span>
    <span class="state" id="state" aria-live="polite"></span>
  </div>
  <button class="tap" id="tap" type="button" hidden>הפעלת הקול של המראיין</button>
  <div class="plate">
    <div class="who"><b id="pname"></b><span id="ptitle"></span></div>
    <div class="tools">
      <button id="replay" type="button" title="השמע שוב" aria-label="השמע שוב" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button id="mute" type="button" title="השתק" aria-label="השתק" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off" d="m16 9 5 6m0-6-5 6"/></svg>
      </button>
    </div>
  </div>
</div>
